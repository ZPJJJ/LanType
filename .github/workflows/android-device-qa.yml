name: LanType signed APK device QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-device-qa.yml'
      - 'tools/lantype-device-qa/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lantype-device-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      ANDROID_SERIAL: emulator-5554
      # API 30's observed ARM-translation startup crash remains separate evidence.
      # API 35 is a comparison target; the actual ARM ABI/bridge gates still apply.
      QA_API_LEVEL: '35'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare small evidence directory
        run: |
          export QA_ROOT="$RUNNER_TEMP/lantype-device-qa"
          export ANDROID_AVD_HOME="$QA_ROOT/avd"
          printf 'QA_ROOT=%s\nANDROID_AVD_HOME=%s\n' "$QA_ROOT" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$QA_ROOT/evidence" "$QA_ROOT/apks" "$QA_ROOT/host" "$ANDROID_AVD_HOME"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['QA_ROOT'])
          free = shutil.disk_usage(root).free
          (root / 'evidence' / 'disk-preflight.json').write_text(json.dumps({
              'freeBytes': free, 'requiredFreeBytes': 8 * 1024**3,
              'scope': 'Reserve room for the official image download/unpack, APKs and fresh guest before starting.'
          }, indent=2) + '\n')
          if free < 8 * 1024**3:
              raise SystemExit('Insufficient free disk for this device QA run')
          PY
      - name: Download and verify fixed public release APKs without credentials
        timeout-minutes: 6
        run: >-
          python3 tools/lantype-device-qa/fetch-release-apks.py
          --output "$QA_ROOT/apks"
          --receipt "$QA_ROOT/evidence/release-apks.json"
      - name: Require KVM on this hosted runner
        run: |
          set -x
          test -c /dev/kvm
          stat /dev/kvm > "$QA_ROOT/evidence/kvm-device-before.txt"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          # The disposable runner must finish applying its device rule before
          # probing it. Apply the same intended mode if this image missed it.
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          stat /dev/kvm > "$QA_ROOT/evidence/kvm-device.txt"
          test -r /dev/kvm
          test -w /dev/kvm
          lscpu > "$QA_ROOT/evidence/runner-cpu.txt"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install the emulator host loader dependency
        timeout-minutes: 3
        # Even with -no-audio, the official emulator links libpulse.so.0.
        # This is a build-runner library; it adds no permission to the app.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          dpkg-query -W libpulse0 > "$QA_ROOT/evidence/emulator-host-libs.txt"
      - name: Install official SDK emulator and comparison Google APIs image
        timeout-minutes: 8
        run: |
          sdkmanager 'platform-tools' 'emulator' "system-images;android-${QA_API_LEVEL};google_apis;x86_64" 'platforms;android-36' 'build-tools;36.0.0'
          "$ANDROID_HOME/emulator/emulator" -version > "$QA_ROOT/evidence/emulator-version.txt" 2>&1
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee "$QA_ROOT/evidence/accel-check.txt"
          cp "$ANDROID_HOME/system-images/android-${QA_API_LEVEL}/google_apis/x86_64/source.properties" "$QA_ROOT/evidence/system-image.txt"
      - name: Build the disposable native editor host without Gradle
        timeout-minutes: 3
        run: >-
          python3 tools/lantype-device-qa/build-editor-host.py
          --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --output "$QA_ROOT/host"
          > "$QA_ROOT/evidence/host-build.txt" 2>&1
      - name: Start a fresh accelerated guest and require an unlocked Android user
        timeout-minutes: 8
        run: |
          printf 'no\n' | avdmanager create avd --force --name "lantype-api${QA_API_LEVEL}" --package "system-images;android-${QA_API_LEVEL};google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd "lantype-api${QA_API_LEVEL}" -port 5554 \
            -accel on -cores 4 -memory 3072 -gpu swiftshader \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            > "$QA_ROOT/evidence/emulator.log" 2>&1 &
          echo "$!" > "$QA_ROOT/emulator.pid"
          timeout 120 adb -s "$ANDROID_SERIAL" wait-for-device
          deadline=$((SECONDS + 300))
          ready=false
          while (( SECONDS < deadline )); do
            kill -0 "$(cat "$QA_ROOT/emulator.pid")"
            boot=$(timeout 10 adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            timeout 10 adb -s "$ANDROID_SERIAL" shell dumpsys user > "$QA_ROOT/evidence/boot-users.txt" 2>&1 || true
            if [[ "$boot" == 1 ]] && grep -q 'RUNNING_UNLOCKED' "$QA_ROOT/evidence/boot-users.txt"; then
              ready=true
              break
            fi
            sleep 3
          done
          "$ready" || { echo 'Android framework did not reach boot-complete and RUNNING_UNLOCKED'; exit 1; }
          adb -s "$ANDROID_SERIAL" shell getprop > "$QA_ROOT/evidence/guest-properties.txt"
          abis=$(adb -s "$ANDROID_SERIAL" shell getprop ro.product.cpu.abilist | tr -d '\r')
          bridge=$(adb -s "$ANDROID_SERIAL" shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')
          [[ ",$abis," == *,arm64-v8a,* ]]
          [[ -n "$bridge" && "$bridge" != 0 ]]
          adb -s "$ANDROID_SERIAL" logcat -d -b all -t 5000 > "$QA_ROOT/evidence/pre-product-logcat.txt"
          if grep -Eq 'WATCHDOG KILLING SYSTEM PROCESS|FATAL EXCEPTION IN SYSTEM PROCESS' "$QA_ROOT/evidence/pre-product-logcat.txt"; then
            echo 'Android framework failed before product installation'
            exit 1
          fi
      - name: Smoke test the real signed APKs and direct upgrade
        timeout-minutes: 15
        # The driver must disable guest networking BEFORE its first product launch.
        # ARM translation is functional evidence, not physical ARM/16 KiB validation.
        run: |
          python3 -u tools/lantype-device-qa/run-device-smoke.py \
            --old-apk "$QA_ROOT/apks/LanType-1.1.0-offline-arm64-v8a.apk" \
            --new-apk "$QA_ROOT/apks/LanType-1.1.1-offline-arm64-v8a.apk" \
            --host-apk "$QA_ROOT/host/lantype-editor-host.apk" \
            --output "$QA_ROOT/evidence/smoke" \
            2>&1 | tee "$QA_ROOT/evidence/smoke-console.txt"
      - name: Verify private clipboard copies across a real product process restart
        timeout-minutes: 5
        # Separate evidence: a core pass does not imply clipboard-extension pass.
        run: |
          python3 -u tools/lantype-device-qa/run-clipboard-smoke.py \
            --core-report "$QA_ROOT/evidence/smoke/result.json" \
            --output "$QA_ROOT/evidence/clipboard" \
            2>&1 | tee "$QA_ROOT/evidence/clipboard-console.txt"
      - name: Preserve final guest diagnostics and stop only this emulator
        if: always()
        timeout-minutes: 2
        run: |
          mkdir -p "$QA_ROOT/evidence"
          if [[ -f "$QA_ROOT/emulator.pid" ]]; then
            timeout 15 adb -s "$ANDROID_SERIAL" logcat -d -b all -t 5000 > "$QA_ROOT/evidence/final-logcat.txt" 2>&1 || true
            timeout 10 adb -s "$ANDROID_SERIAL" shell dumpsys user > "$QA_ROOT/evidence/final-users.txt" 2>&1 || true
            # Native-bridge crashes may have only anonymous frames in logcat.
            # Keep the shell-visible tombstone/exit records before guest teardown.
            timeout 10 adb -s "$ANDROID_SERIAL" shell dumpsys dropbox --print data_app_native_crash > "$QA_ROOT/evidence/native-app-dropbox.txt" 2>&1 || true
            timeout 10 adb -s "$ANDROID_SERIAL" shell dumpsys dropbox --print SYSTEM_TOMBSTONE > "$QA_ROOT/evidence/native-system-tombstones.txt" 2>&1 || true
            timeout 10 adb -s "$ANDROID_SERIAL" shell dumpsys activity exit-info app.lantype.keyboard > "$QA_ROOT/evidence/product-exit-info.txt" 2>&1 || true
            timeout 15 adb -s "$ANDROID_SERIAL" emu kill > "$QA_ROOT/evidence/emulator-stop.txt" 2>&1 || true
            pid=$(cat "$QA_ROOT/emulator.pid")
            if kill -0 "$pid" 2>/dev/null; then kill "$pid" || true; fi
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ['QA_ROOT']) / 'evidence'
          limit = 2 * 1024 * 1024
          for path in evidence.rglob('*'):
              if path.is_file() and path.suffix in {'.txt', '.log'} and path.stat().st_size > limit:
                  original_size = path.stat().st_size
                  with path.open('rb') as stream:
                      stream.seek(-limit, 2)
                      tail = stream.read()
                  notice = f'[CI retained the last {limit} bytes of a {original_size}-byte log.]\n'
                  path.write_bytes(notice.encode() + tail)
          PY
      - name: Retain only small QA evidence for seven days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lantype-signed-apk-device-qa-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lantype-device-qa/evidence/**/*.json
            ${{ runner.temp }}/lantype-device-qa/evidence/**/*.jsonl
            ${{ runner.temp }}/lantype-device-qa/evidence/**/*.xml
            ${{ runner.temp }}/lantype-device-qa/evidence/**/*.png
            ${{ runner.temp }}/lantype-device-qa/evidence/**/*.txt
            ${{ runner.temp }}/lantype-device-qa/evidence/**/*.log
