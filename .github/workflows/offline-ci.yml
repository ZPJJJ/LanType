name: LanType offline build

on:
  push:
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lantype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job has its own fresh bounded volume; needs keeps the two jobs serial.
  build-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reserve the bounded offline build work volume
        id: volume
        run: |
          set -euo pipefail
          # runner.temp cannot be referenced in a job-level env expression.
          export LANTYPE_OFFLINE_WORK_ROOT="$RUNNER_TEMP/lantype-offline-work"
          export LANTYPE_OFFLINE_VOLUME="$RUNNER_TEMP/lantype-offline-volume.img"
          export LANTYPE_OFFLINE_RECEIPTS="$RUNNER_TEMP/lantype-offline-receipts"
          export LANTYPE_OFFLINE_HOST_SDK="$ANDROID_HOME"
          printf 'LANTYPE_OFFLINE_WORK_ROOT=%s\nLANTYPE_OFFLINE_VOLUME=%s\nLANTYPE_OFFLINE_RECEIPTS=%s\nLANTYPE_OFFLINE_HOST_SDK=%s\n' \
            "$LANTYPE_OFFLINE_WORK_ROOT" "$LANTYPE_OFFLINE_VOLUME" "$LANTYPE_OFFLINE_RECEIPTS" "$LANTYPE_OFFLINE_HOST_SDK" >> "$GITHUB_ENV"
          test ! -e "$LANTYPE_OFFLINE_WORK_ROOT"
          test ! -e "$LANTYPE_OFFLINE_VOLUME"
          test ! -e "$LANTYPE_OFFLINE_RECEIPTS"
          mkdir "$LANTYPE_OFFLINE_RECEIPTS"
          # Keep the original local storage guard unchanged, then reserve the
          # hosted app-job budget on the actual filesystem that holds its volume.
          python3 scripts/storage_guard.py > "$LANTYPE_OFFLINE_RECEIPTS/storage-preflight.txt"
          python3 - <<'PYHOST'
          import json, os, shutil
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          volume_parent = Path(os.environ['LANTYPE_OFFLINE_VOLUME']).parent
          if volume_parent != temporary:
              raise SystemExit('Offline volume must be created directly in RUNNER_TEMP')
          free = shutil.disk_usage(volume_parent).free
          required_free = 28 * 1024**3
          preflight = {
              'schemaVersion': 1, 'filesystemPath': str(volume_parent),
              'freeBytes': free, 'requiredFreeBytes': required_free,
              'hostReserveBytes': 20 * 1024**3, 'taskBudgetBytes': 8 * 1024**3,
              'workVolumeCapacityBytes': 7680 * 1024**2,
              'outsideCheckpointLimitBytes': 512 * 1024**2,
              'wholeTaskHardQuota': False, 'passed': free >= required_free,
              'scope': 'Hosted offline-ci APK or targeted-test job only; the original storage guard is unchanged.'
          }
          destination = Path(os.environ['LANTYPE_OFFLINE_RECEIPTS']) / 'host-budget-preflight.json'
          with destination.open('x', encoding='utf-8') as output:
              output.write(json.dumps(preflight, indent=2, sort_keys=True) + '\n')
          print(json.dumps(preflight, sort_keys=True))
          if not preflight['passed']:
              raise SystemExit('Offline CI requires 28 GiB free: 20 GiB host reserve plus 8 GiB task budget')
          PYHOST
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "Preinstalled Python 3.12 is required"'
          test -x "$JAVA_HOME_21_X64/bin/javac"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          fallocate -l 7680M "$LANTYPE_OFFLINE_VOLUME"
          mkfs.ext4 -q -F -m 0 "$LANTYPE_OFFLINE_VOLUME"
          mkdir "$LANTYPE_OFFLINE_WORK_ROOT"
          sudo mount -o loop,nodev,nosuid "$LANTYPE_OFFLINE_VOLUME" "$LANTYPE_OFFLINE_WORK_ROOT"
          sudo chown "$(id -u):$(id -g)" "$LANTYPE_OFFLINE_WORK_ROOT"
          mkdir -p "$LANTYPE_OFFLINE_WORK_ROOT"/{evidence,sdk,tmp,cache,gradle-user,java-user,android-user}
          fallocate -l 8M "$LANTYPE_OFFLINE_WORK_ROOT/evidence-reserve.bin"
          # The wrapper separately sets Java's user.home cache location. The
          # runner's HOME, original checkout and preinstalled SDK remain inputs.
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\nXDG_CACHE_HOME=%s\n' \
            "$LANTYPE_OFFLINE_WORK_ROOT/tmp" "$LANTYPE_OFFLINE_WORK_ROOT/tmp" \
            "$LANTYPE_OFFLINE_WORK_ROOT/tmp" "$LANTYPE_OFFLINE_WORK_ROOT/cache" >> "$GITHUB_ENV"
          python3 scripts/run-offline-build-env.py --stage budget --label initialized
      - name: Copy this checkout and reuse the installed JDK and SDK packages
        timeout-minutes: 15
        # No setup-android/global SDK install, emulator, old NDK or CMake build.
        # Only fixed platform/build-tools packages may be added to this overlay.
        run: python3 scripts/run-offline-build-env.py --stage prepare
      - name: Check the public source inventory
        run: >-
          python3 scripts/run-offline-build-env.py --stage execute --label public-source --timeout 120 --
          python3 scripts/check-public-source.py
      - name: Check pinned source verification regressions
        run: |
          python3 scripts/run-offline-build-env.py --stage execute --label source-verification --timeout 120 -- \
            bash -euo pipefail -c '
              python3 scripts/test-native-source-verification.py
              python3 scripts/test-ort-runtime.py
            '
      - name: Prepare approved runtime data and native dependencies
        timeout-minutes: 12
        run: |
          python3 scripts/run-offline-build-env.py --stage execute --label restore-runtime --timeout 660 -- \
            bash -euo pipefail -c '
              mkdir -p app/build/reports/lantype-native
              python3 scripts/restore-base-runtime.py --download --receipt app/build/reports/lantype-native/base-restoration.json
              python3 scripts/prepare-upstream.py --verify-only
              python3 scripts/build-camerax-native.py --verify-only
              python3 scripts/verify-commercial-resources.py
              python3 scripts/restore-ort-runtime.py --download --bounded-work-root "$LANTYPE_OFFLINE_WORK_ROOT" \
                --bounded-work-limit-mib 7680 \
                > app/build/reports/lantype-native/ort-restoration.json
            '
      - name: Reclaim only the two verified runtime download archives
        timeout-minutes: 3
        run: python3 scripts/run-offline-build-env.py --stage prune-runtime-archives
      - name: Build offline release variant
        timeout-minutes: 31
        run: >-
          python3 scripts/run-offline-build-env.py --stage execute --label assemble-offline --timeout 1800 --
          ./gradlew :app:assembleOffline --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
      - name: Verify final APK data and accepted native replacements
        timeout-minutes: 4
        run: |
          python3 scripts/run-offline-build-env.py --stage execute --label verify-apk --timeout 210 -- \
            bash -euo pipefail -c '
              shopt -s nullglob
              apks=(app/build/outputs/apk/offline/*.apk)
              test "${#apks[@]}" -gt 0
              for apk in "${apks[@]}"; do
                python3 scripts/prepare-ort-runtime.py --accepted-lock docs/licensing/ort-runtime.lock.json \
                  --verify-apk "$apk" --receipt "$apk.native.json"
                python3 scripts/build-camerax-native.py --verify-apk "$apk"
                python3 scripts/verify-commercial-resources.py --apk "$apk"
              done
            '
      - name: Preserve final allocation and command diagnostics
        id: collect
        if: always() && steps.volume.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/run-offline-build-env.py --stage collect
      - name: Preserve unsigned APK, mappings and build evidence
        id: evidence
        if: always() && env.LANTYPE_OFFLINE_RECEIPTS != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lantype-unsigned-offline-build
          if-no-files-found: warn
          compression-level: 0
          path: |
            ${{ env.LANTYPE_OFFLINE_RECEIPTS }}/
            ${{ env.LANTYPE_OFFLINE_WORK_ROOT }}/evidence/
            ${{ env.LANTYPE_OFFLINE_WORK_ROOT }}/source/app/build/outputs/apk/offline/*.apk
            ${{ env.LANTYPE_OFFLINE_WORK_ROOT }}/source/app/build/outputs/apk/offline/*.native.json
            ${{ env.LANTYPE_OFFLINE_WORK_ROOT }}/source/app/build/outputs/mapping/offline/
            ${{ env.LANTYPE_OFFLINE_WORK_ROOT }}/source/app/build/reports/lantype-native/
            docs/licensing/ort-runtime.lock.json
      - name: Remove this job's volume only after successful evidence upload
        if: always() && steps.evidence.outcome == 'success' && steps.collect.outcome == 'success'
        run: |
          set -euo pipefail
          test "$LANTYPE_OFFLINE_WORK_ROOT" = "$RUNNER_TEMP/lantype-offline-work"
          test "$LANTYPE_OFFLINE_VOLUME" = "$RUNNER_TEMP/lantype-offline-volume.img"
          if mountpoint -q "$LANTYPE_OFFLINE_WORK_ROOT"; then sudo umount "$LANTYPE_OFFLINE_WORK_ROOT"; fi
          rmdir "$LANTYPE_OFFLINE_WORK_ROOT"
          rm -- "$LANTYPE_OFFLINE_VOLUME"

  tests-and-renders:
    needs: build-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
