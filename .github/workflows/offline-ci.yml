        run: >-
          python3 scripts/run-offline-build-env.py --stage execute --label tests-and-renders --timeout 1800 --
          bash scripts/test-targeted.sh
      - name: Preserve final allocation and command diagnostics
        id: collect
        if: always() && steps.volume.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/run-offline-build-env.py --stage collect
