          export LANTYPE_OFFLINE_RECEIPTS="$RUNNER_TEMP/lantype-offline-receipts"
          export LANTYPE_OFFLINE_HOST_SDK="$ANDROID_HOME"
          printf 'LANTYPE_OFFLINE_WORK_ROOT=%s\nLANTYPE_OFFLINE_VOLUME=%s\nLANTYPE_OFFLINE_RECEIPTS=%s\nLANTYPE_OFFLINE_HOST_SDK=%s\n' \
            "$LANTYPE_OFFLINE_WORK_ROOT" "$LANTYPE_OFFLINE_VOLUME" "$LANTYPE_OFFLINE_RECEIPTS" "$LANTYPE_OFFLINE_HOST_SDK" >> "$GITHUB_ENV"
          test ! -e "$LANTYPE_OFFLINE_WORK_ROOT"
          test ! -e "$LANTYPE_OFFLINE_VOLUME"
