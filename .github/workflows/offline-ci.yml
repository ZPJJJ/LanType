            ${{ env.LANTYPE_OFFLINE_WORK_ROOT }}/source/app/build/reports/tests/testDebugUnitTest/
            ${{ env.LANTYPE_OFFLINE_WORK_ROOT }}/source/app/build/lantype-ci-renders/*.png
